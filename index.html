<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
<title>달고나 뽑기의 달인</title>
<meta name="description" content="이거 안 깨고 뽑을 수 있어?">
<meta property="og:type" content="website">
<meta property="og:title" content="달고나 뽑기의 달인">
<meta property="og:description" content="이거 안 깨고 뽑을 수 있어?">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="src/styles/main.css?v=20261117" />
</head>
<body>
<script>if (/^#battle\//.test(location.hash)) document.documentElement.classList.add("boot-challenge");</script>
<div class="app" id="app">

  <!-- INTRO : 비주얼 → 제목 → [시작하기] (주차하기와 같은 구조 — 묶음 전체를 위:아래 1:2) -->
  <section id="screen-intro" class="screen active">
    <div class="slot-visual"><canvas id="intro-canvas"></canvas></div>
    <h1 class="slot-title main">한 번에 뽑으세요</h1>
    <div class="slot-actions"><button id="btn-start" class="cta" type="button">시작하기</button></div>
  </section>

  <!-- SHAPE SELECT : 선택한 모양 미리보기 → 제목 → 2×2 그리드 → [시작하기]  ("고르는 화면" 그룹 — MINIGAME_SYSTEM §37-2A) -->
  <section id="screen-select" class="screen">
    <div class="slot-visual"><canvas id="select-canvas"></canvas></div>
    <h2 class="slot-title">모양을 선택하세요</h2>
    <div class="slot-body"><div class="shape-grid" id="shape-grid"></div></div>
    <div class="slot-actions"><button id="btn-play" class="cta" type="button">시작하기</button></div>
  </section>

  <!-- DRAW : 직접 그리기 — 빈 달고나 위에 도안 그리기 → [다시 그리기][완료] -->
  <section id="screen-draw" class="screen">
    <h2 class="slot-title">도안을 그려주세요</h2>
    <p class="draw-guide">시작점과 끝점이 만나도록 그려주세요</p>
    <div class="draw-box"><canvas id="draw-canvas"></canvas></div>
    <p class="draw-msg" id="draw-msg" role="status" aria-live="polite"></p>
    <div class="slot-actions draw-actions">
      <button id="btn-draw-reset" class="btn-secondary" type="button">다시 그리기</button>
      <button id="btn-draw-done" class="cta" type="button">완료</button>
    </div>
  </section>

  <!-- PLAY : 진행 카드 2열 → 안내 → 달고나 → [조작 안내 | 다시 시작] → (터치) 조작 패드 — 모든 요소가 같은 좌우선 -->
  <section id="screen-play" class="screen">
    <span id="hud-name" hidden>동그라미</span>
    <div class="stats">
      <div class="stat"><span class="stat-label">긁기 진행률</span><span class="stat-value" id="hud-prog">0%</span><i class="gauge gauge-prog"><u id="bar-prog"></u></i></div>
      <div class="stat"><span class="stat-label">균열</span><span class="stat-value" id="hud-crack">0%</span><i class="gauge gauge-crack"><u id="bar-crack"></u></i></div>
    </div>
    <p class="hint" id="hint">SPACE를 누른 채 방향키로 조절하세요</p>
    <div class="stage" id="stage">
      <div class="stage-box">
        <canvas id="stage-canvas"></canvas>
      </div>
    </div>
    <div class="help-row">
      <button id="btn-restart" class="restart-btn" type="button"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>다시 시작</button>
      <button type="button" class="pull-btn" id="btn-pull" data-act="separate" disabled>뽑기</button>
    </div>
    <div class="controls" id="controls">
      <div class="dpad" aria-label="방향 버튼">
        <button class="pad-btn" type="button" data-dir="up" aria-label="위">↑</button>
        <button class="pad-btn" type="button" data-dir="left" aria-label="왼쪽">←</button>
        <button class="pad-btn" type="button" data-dir="right" aria-label="오른쪽">→</button>
        <button class="pad-btn" type="button" data-dir="down" aria-label="아래">↓</button>
      </div>
      <div class="actions">
        <button type="button" class="pad-btn act-scratch" data-act="scratch">긁기</button>
      </div>
    </div>
    <p class="result-mark play-mark">@ccojik.dh</p>
  </section>

  <!-- RESULT : [비주얼(최종 달고나)] → [점수 · 한 줄 평가 · 상세 한 줄] → [도전장] → [다른 모양 도전][다시 뽑기] → 워터마크 -->
  <section id="screen-result" class="screen">
    <div class="slot-visual result-visual"><canvas id="result-canvas"></canvas><img id="result-crowd" class="crowd" alt="" draggable="false"></div>
    <div class="slot-body result-body">
      <div class="result-score" id="result-score">0<span class="unit">점</span></div>
      <div class="result-grade" id="result-grade"></div>
      <div class="result-comment" id="result-sub"></div>
      <div class="result-comment" id="result-detail"></div>
    </div>
    <div class="slot-actions">
      <button id="btn-challenge" class="cta" type="button">친구에게 도전장 보내기</button>
      <p class="result-note" id="challenge-note" hidden></p>
      <div class="result-secondary">
        <button id="btn-change" class="btn-secondary" type="button">다른 모양 도전</button>
        <button id="btn-again" class="btn-secondary" type="button">다시 뽑기</button>
      </div>
    </div>
    <p class="result-mark">@ccojik.dh</p>
  </section>

  <!-- CHALLENGE (도전장 링크로 진입): 비주얼(친구의 최종 모습) → 제목 → 기록 → [도전 시작] -->
  <section id="screen-challenge" class="screen">
    <div class="slot-visual"><canvas id="challenge-canvas"></canvas></div>
    <h2 class="slot-title">도전장이 도착했습니다</h2>
    <div class="slot-body challenge-body">
      <p id="challenge-name" class="challenge-name">친구의 기록</p>
      <div id="challenge-score" class="result-score">0<span class="unit">점</span></div>
      <p class="battle-hint">이길 수 있으면 해보세요.</p>
    </div>
    <div class="slot-actions"><button id="btn-challenge-start" class="cta" type="button">도전 시작</button></div>
  </section>

  <!-- BATTLE RESULT: 비주얼(친구 / 나) → 점수 VS 점수 → 승패 → [다시 붙기] [내 결과 자세히 보기] -->
  <section id="screen-battle" class="screen">
    <div class="slot-visual vs-visual">
      <div class="vs-fig"><div class="vs-canvas-box"><canvas id="vs-a-canvas"></canvas></div><span id="vs-a-name" class="vs-name"></span></div>
      <span class="vs-mid">VS</span>
      <div class="vs-fig"><div class="vs-canvas-box"><canvas id="vs-b-canvas"></canvas></div><span id="vs-b-name" class="vs-name"></span></div>
    </div>
    <h2 class="slot-title vs-scores"><span id="vs-a-score">0</span><span class="vs-sep">VS</span><span id="vs-b-score">0</span></h2>
    <div class="slot-body"><p id="vs-winner" class="vs-winner"></p></div>
    <div class="slot-actions">
      <button id="btn-rematch" class="cta" type="button">다시 붙기</button>
      <button id="btn-vs-detail" class="btn-secondary" type="button">내 결과 자세히 보기</button>
    </div>
  </section>

  <p class="toast" id="toast" hidden></p>
</div>

<!-- 도전장에 적을 닉네임 -->
<div id="modal" class="modal hidden">
  <div class="modal-card">
    <p class="modal-title">도전장에 적을 닉네임</p>
    <input id="modal-input" type="text" maxlength="12" placeholder="예: 달고나장인" autocomplete="off">
    <div class="btn-row">
      <button id="modal-cancel" class="btn-secondary" type="button">취소</button>
      <button id="modal-ok" class="cta" type="button">확인</button>
    </div>
  </div>
</div>

<script src="src/game/config.js?v=20261117"></script>
<script src="src/game/paths.js?v=20261117"></script>
<script src="src/game/shapes.js?v=20261117"></script>
<script src="src/game/engine.js?v=20261117"></script>
<script src="src/game/view.js?v=20261117"></script>
<script src="src/game/draw.js?v=20261117"></script>
<script src="src/game/battle.js?v=20261117"></script>
<script src="src/game/input.js?v=20261117"></script>
<script src="src/main.js?v=20261117"></script>
<script>window.SITE_ANALYTICS_PROJECT='dalgona-game';</script>
<script src="https://kimh6ram-dot.github.io/_parking/analytics.js"></script>
</body>
</html>
